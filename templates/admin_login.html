<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login - Digital Grievance</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f4f7;

            display: flex;
            justify-content: center;
            align-items: center;

            height: 100vh;
        }

        .login-container {
            width: 380px;
            background: white;
            padding: 35px;

            border-radius: 12px;

            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;

            margin-bottom: 20px;

            border: 1px solid #ccc;
            border-radius: 6px;

            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;

            background: #1e3a8a;
            color: white;

            border: none;
            border-radius: 6px;

            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #162d6b;
        }

        .back {
            text-align: center;
            margin-top: 20px;
        }

        .back a {
            text-decoration: none;
            color: #1e3a8a;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <h1>Admin Login</h1>

        <p class="subtitle">
            Digital Grievance Intelligence
        </p>

        <form method="POST" action="/admin-login">

            <label for="email">Email</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter admin email"
                required
            >

            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter admin password"
                required
            >

            <button type="submit">
                Login as Admin
            </button>

        </form>

        <div class="back">
            <a href="/">
                ← Back to Home
            </a>
        </div>

    </div>

</body>
</html>
